name: Import Find an Apprenticeship vacancies

on:
  schedule:
    - cron: "25 6 * * *"
  workflow_dispatch:

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GrowthGrind
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install supabase

      - name: Import recent live apprenticeship vacancies
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APPRENTICESHIPS_API_KEY: ${{ secrets.APPRENTICESHIPS_API_KEY }}
        run: python scripts/apprenticeship_import.py
